name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same gate as locally: debug build, unit tests, lint.
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      # Signed with the runner's throwaway debug key: it installs on a clean
      # device, but not over a build signed with another key.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: torrmedia-android-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
