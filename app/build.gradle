plugins {
    id("com.android.application")
    id("com.google.devtools.ksp")
    id("com.google.firebase.crashlytics")
    id("com.google.gms.google-services")
    id("org.jetbrains.kotlin.android")
}

android {

    lint {
        // Lint is a release gate, so its noise is silenced selectively, not wholesale.
        // MissingTranslation: the fork has no translators for bg/uk/zh, and an untranslated
        // string is simply shown in English. Everything else, including NewApi
        // (a real crash on old devices with minSdk 16), stays an error.
        disable 'MissingTranslation'
        abortOnError true
        warningsAsErrors false
    }
    compileSdk 37
    defaultConfig {
        applicationId "io.github.yurinei.torrmedia"
        minSdkVersion 16
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        multiDexEnabled true
        versionCode 144
        versionName "MatriX.144"
        // Use SupportLibrary for vectors
        vectorDrawables.useSupportLibrary = true
    }
    // Release signing: settings come from keystore.properties in the project root or from
    // environment variables. Keys stay out of the repository (keystore.properties and *.jks
    // are in .gitignore). If nothing is set, release builds unsigned instead of failing.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists())
                propsFile.withInputStream { props.load(it) }
            def storePath = props.getProperty("storeFile") ?: System.getenv("TORRMEDIA_KEYSTORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword props.getProperty("storePassword") ?: System.getenv("TORRMEDIA_KEYSTORE_PASSWORD")
                keyAlias props.getProperty("keyAlias") ?: System.getenv("TORRMEDIA_KEY_ALIAS")
                keyPassword props.getProperty("keyPassword") ?: System.getenv("TORRMEDIA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // the config is applied only when a keystore is actually set up
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    namespace 'ru.yourok.torrserve'
    buildFeatures {
        buildConfig true
    }
}

kotlin {
    jvmToolchain(21)
}

// Build time in the file name: the app version does not change between builds,
// and without the stamp there is no telling which APK is newer, while installs are manual.
// The new AGP no longer accepts archivesBaseName in defaultConfig, only base.archivesName.
base {
    archivesName = "torrmedia-android-" + android.defaultConfig.versionName + "-" + new Date().format("yyyyMMdd-HHmm")
}

dependencies {
    def appCompatVersion = '1.6.1' // 1.6.1 last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.appcompat:appcompat:${appCompatVersion}"
    def constraintVersion = '2.1.4' // 2.1.4 last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.constraintlayout:constraintlayout:${constraintVersion}"
    def coreKtxVersion = '1.12.0' // 1.12.0 last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.core:core-ktx:${coreKtxVersion}"
    def lifecycleVersion = '2.6.2' // 2.6.2 last api16 compatible
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${lifecycleVersion}"
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${lifecycleVersion}"
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycleVersion}"
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-process:${lifecycleVersion}"
    // multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    //noinspection GradleDependency
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    // speed test
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    // glide
    def glideVersion = '4.16.0'
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    ksp "com.github.bumptech.glide:ksp:${glideVersion}"
    implementation "com.github.bumptech.glide:annotations:${glideVersion}"
    // root shell
    def libsuVersion = '3.2.1' // 3.2.1 last api16 compatible
    //noinspection GradleDependency
    implementation "com.github.topjohnwu.libsu:core:${libsuVersion}"
    def muiVersion = '1.11.0' // 1.11.0 last api16 compatible
    //noinspection GradleDependency
    implementation "com.google.android.material:material:${muiVersion}"
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    // json serializer
    def jsonVersion = '2.9.1' // 2.10.1 thorow java.lang.VerifyError on api17
    //noinspection GradleDependency
    implementation "com.google.code.gson:gson:${jsonVersion}"
    // firebase
    //noinspection GradleDependency firebase-core:19.0.2 is last api16 compatible
    implementation 'com.google.firebase:firebase-core:19.0.2'
    //noinspection GradleDependency firebase-analytics:19.0.2 is last api16 compatible
    implementation 'com.google.firebase:firebase-analytics:19.0.2'
    //noinspection GradleDependency firebase-crashlytics:18.2.5 is last api16 compatible
    implementation 'com.google.firebase:firebase-crashlytics:18.2.5'
    // SSL
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'
    //noinspection GradleDependency conscrypt-android:2.5.3 is last api16 compatible
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // http client/parser
    def jsoupVersion = '1.16.1' // 1.16.2, 1.17.1, 1.17.2 thorow java.lang.VerifyError on api19
    //noinspection GradleDependency
    implementation "org.jsoup:jsoup:${jsoupVersion}"
    // JVM unit tests of pure logic (matching by hash, state classification,
    // parsing torrmedia responses): test configuration only, not shipped in the APK
    testImplementation 'junit:junit:4.13.2'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}